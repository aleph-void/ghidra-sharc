// Ghidra extension build.
//
//   tools/build.sh                                     # the usual way
//   GHIDRA_INSTALL_DIR=/path/to/ghidra gradle buildExtension
//
// buildExtension does not compile SLEIGH, and a zip without the .sla files
// installs cleanly and then fails at import with "Unsupported language".
// tools/build.sh compiles the .slaspec files first and checks the zip.
def ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR ?:
	(project.hasProperty("GHIDRA_INSTALL_DIR") ? project.getProperty("GHIDRA_INSTALL_DIR") : null)
if (!ghidraInstallDir) {
	throw new GradleException("Set GHIDRA_INSTALL_DIR (env or -P) to a Ghidra installation")
}

apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"

// The module has no third-party dependencies.  buildExtension.gradle's copyDependencies would
// otherwise copy every jar it finds under Ghidra/Processors into lib/, including other
// modules' jars when those are symlinked in from outside the Ghidra install (and it fails
// when this module itself is symlinked there for the test suite).
copyDependencies.enabled = false

// Development material that has no use inside Ghidra.
tasks.named("buildExtension") {
	exclude ".github/**"
	exclude "scratch/**"
	exclude "test/**"
	exclude "tests/**"
	exclude "tools/**"
	exclude "data/languages/*.sinc.in"
}
